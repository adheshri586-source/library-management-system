<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Library Desk</title>
<style>
:root{--green:#244b38;--sage:#789477;--ivory:#f5f0e5;--sand:#d6c6a5;--ink:#20372b;--muted:#718074;--line:#e1dfd3;--white:#fffefa;--red:#a3453b;--shadow:0 18px 50px #1f352512}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:var(--green);color:#fff;padding:28px 18px;display:flex;flex-direction:column;gap:30px}.brand{display:flex;align-items:center;gap:12px;padding:0 9px}.brand-mark{width:42px;height:42px;border-radius:14px;background:#ffffff1c;display:grid;place-items:center;font-size:23px}.brand strong{font:700 19px Georgia,serif;display:block}.brand small{color:#d5e2d3}.nav{display:grid;gap:7px}.nav button{border:0;text-align:left;padding:12px 14px;background:transparent;color:#dbe6db;border-radius:11px;font-weight:600}.nav button.active,.nav button:hover{background:#ffffff1b;color:white}.side-note{margin-top:auto;padding:16px;border:1px solid #ffffff25;border-radius:14px;color:#e3ebdf;font-size:13px}.main{min-width:0;padding:30px clamp(18px,4vw,54px);max-width:1600px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;color:var(--sage);font-size:11px;font-weight:800}.top h1{font:700 clamp(26px,3vw,34px) Georgia,serif;color:var(--green);margin:4px 0}.userbox{display:flex;align-items:center;gap:12px}.avatar{background:#e0e8dc;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;color:var(--green);font-weight:800}.userbox small{display:block;color:var(--muted)}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--green);color:white;font-weight:700}.btn:hover{background:#315d47}.btn.secondary{background:#e7ecdf;color:var(--green)}.btn.danger{background:#f7e6e1;color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.panel{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:19px 20px}.stat label{color:var(--muted);font-size:13px;font-weight:600}.stat strong{display:block;color:var(--green);font:700 30px Georgia,serif;margin-top:5px}.panel{padding:21px;margin-bottom:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.section-head h2{font:700 21px Georgia,serif;color:var(--green);margin:0}.section-head p{margin:3px 0;color:var(--muted);font-size:13px}.tools{display:flex;gap:9px;flex-wrap:wrap}.input{border:1px solid #d8d9ce;border-radius:9px;background:#fff;padding:10px 12px;color:var(--ink);outline:none}.input:focus{border-color:var(--sage);box-shadow:0 0 0 3px #78947722}.search{min-width:245px}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800;padding:11px 12px;border-bottom:1px solid var(--line)}td{padding:13px 12px;border-bottom:1px solid #eeede6;font-size:14px}tr:last-child td{border-bottom:0}.book-title{font-weight:700;color:var(--green)}.sub{font-size:12px;color:var(--muted)}.pill{display:inline-block;border-radius:99px;padding:4px 9px;background:#e7eddf;color:#3d694e;font-size:11px;font-weight:800}.pill.out{background:#f7e8db;color:#9b5a2c}.table-wrap{overflow:auto}.welcome{background:linear-gradient(112deg,#244b38,#426c50);color:white;padding:24px 27px;border-radius:16px;margin-bottom:20px}.welcome h2{font:700 24px Georgia,serif;margin:0 0 5px}.welcome p{margin:0;color:#e0e9df}.empty{padding:34px;text-align:center;color:var(--muted)}.hidden{display:none!important}.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--ivory)}.login-art{background:var(--green);padding:clamp(35px,8vw,110px);color:white;display:flex;flex-direction:column;justify-content:center}.login-art h1{font:700 clamp(37px,5vw,58px)/1.08 Georgia,serif;max-width:490px;margin:22px 0}.login-art p{color:#d8e4d6;max-width:430px}.login-art .brand{padding:0}.login-form-wrap{display:grid;place-items:center;padding:25px}.login-form{width:min(390px,100%)}.login-form h2{font:700 34px Georgia,serif;color:var(--green);margin:0 0 4px}.login-form>p{color:var(--muted);margin:0 0 24px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:13px;font-weight:700;color:#485d4d}.field input,.field select{width:100%}.login-form .btn{width:100%;margin-top:9px;padding:12px}.demo{margin-top:20px;padding:13px;background:#ecefe5;border-radius:10px;color:#55675a;font-size:12px}.register-link{display:block;text-align:center;margin-top:15px;color:var(--green);font-weight:700;cursor:pointer}.toast{position:fixed;right:24px;bottom:24px;background:var(--green);color:#fff;padding:13px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:10}.toast.error{background:var(--red)}dialog{border:0;border-radius:16px;padding:24px;width:min(470px,calc(100vw - 30px));box-shadow:0 25px 80px #10201555;color:var(--ink)}dialog::backdrop{background:#10201577}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h2{margin:0;color:var(--green);font:700 23px Georgia,serif}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.mobile-head{display:none}
@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{padding:12px 16px;gap:12px}.brand{padding:0}.side-note{display:none}.nav{display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;padding:9px 12px}.main{padding-top:20px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.top{align-items:flex-start}.top h1{font-size:26px}.userbox .user-name{display:none}.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:25px}.panel{padding:14px}.section-head{align-items:flex-start;flex-direction:column}.search{min-width:0;width:100%}.tools{width:100%}.login{grid-template-columns:1fr}.login-art{padding:27px 25px}.login-art h1{font-size:36px;margin:13px 0}.login-art p{margin-bottom:0}.login-form-wrap{padding:35px 22px}.top .btn{padding:8px 10px}}
</style></head>
<body><div id="app"></div><dialog id="bookDialog"><form id="bookForm" method="dialog"><div class="modal-head"><h2>Add a book</h2><button type="button" class="btn secondary small" onclick="bookDialog.close()">✕</button></div><div class="field"><label>Book title</label><input class="input" name="title" required></div><div class="field"><label>Author</label><input class="input" name="author" required></div><div class="field"><label>Category</label><input class="input" name="category" placeholder="e.g. Fiction" required></div><div class="field"><label>Number of copies</label><input class="input" name="copies" type="number" min="1" required></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="bookDialog.close()">Cancel</button><button class="btn">Add book</button></div></form></dialog>
<script>
const seedBooks=[['The Alchemist','Paulo Coelho','Fiction',5],['Atomic Habits','James Clear','Self Help',4],['Clean Code','Robert C. Martin','Programming',3],['Harry Potter and the Philosopher’s Stone','J. K. Rowling','Fantasy',4],['Introduction to Algorithms','Cormen et al.','Computer Science',3],['Wings of Fire','A. P. J. Abdul Kalam','Biography',5],['Rich Dad Poor Dad','Robert Kiyosaki','Finance',4],['The Psychology of Money','Morgan Housel','Finance',3],['Pride and Prejudice','Jane Austen','Classic',3],['1984','George Orwell','Dystopian',3],['The Hobbit','J. R. R. Tolkien','Fantasy',3],['Python Crash Course','Eric Matthes','Programming',3],['Let Us C','Yashavant Kanetkar','Programming',4],['Data Structures and Algorithms','Narasimha Karumanchi','Computer Science',3],['Operating System Concepts','Silberschatz et al.','Computer Science',3],['Computer Networks','Andrew S. Tanenbaum','Computer Science',3],['The Great Gatsby','F. Scott Fitzgerald','Classic',3],['Sapiens','Yuval Noah Harari','History',3],['Ikigai','Hector Garcia','Self Help',3],['Think Like a Monk','Jay Shetty','Self Help',3]];
const users=[{id:'U000',name:'Library Admin',email:'admin@library.com',password:'admin123',role:'Admin',department:'Library'},{id:'U001',name:'Aarav Sharma',email:'aarav@college.com',password:'student123',role:'Student',department:'Computer Science'},{id:'U002',name:'Meera Verma',email:'meera@college.com',password:'student123',role:'Student',department:'Electronics'},{id:'U003',name:'Kabir Singh',email:'kabir@college.com',password:'student123',role:'Student',department:'Computer Science'},{id:'U004',name:'Dr. Neha Kapoor',email:'neha@college.com',password:'faculty123',role:'Faculty',department:'Computer Science'},{id:'U005',name:'Dr. Rahul Mehta',email:'rahul@college.com',password:'faculty123',role:'Faculty',department:'Mathematics'}];
let db=JSON.parse(localStorage.getItem('libraryDeskData')||'null');if(!db){db={users,books:seedBooks.map((b,i)=>({id:'B'+String(i+1).padStart(3,'0'),title:b[0],author:b[1],category:b[2],total:b[3],available:b[3]})),loans:[]};save();}let me=JSON.parse(sessionStorage.getItem('libraryDeskUser')||'null'),page='Overview',filter='';function save(){localStorage.setItem('libraryDeskData',JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(prefix,items){return prefix+String(Math.max(0,...items.map(x=>parseInt(x.id.slice(1))||0))+1).padStart(3,'0')}function toast(s,error=false){let t=document.createElement('div');t.className='toast'+(error?' error':'');t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2600)}function fine(l){if(me?.role==='Faculty')return 0;let stop=l.returnDate?new Date(l.returnDate):new Date(),due=new Date(l.dueDate);return Math.max(0,Math.floor((new Date(stop.toDateString())-new Date(due.toDateString()))/86400000))*2}function loginView(){document.getElementById('app').innerHTML=`<main class="login"><section class="login-art"><div class="brand"><div class="brand-mark">▤</div><div><strong>Library Desk</strong><small>Campus collection</small></div></div><h1>A quieter place to find your next idea.</h1><p>Browse the collection, borrow books, and keep track of every due date in one simple library workspace.</p><p style="margin-top:38px;font-size:13px">BOOKS &nbsp;•&nbsp; LEARN &nbsp;•&nbsp; GROW</p></section><section class="login-form-wrap"><form class="login-form" id="loginForm"><div class="eyebrow">Member access</div><h2>Welcome back</h2><p>Sign in to continue to your library.</p><div class="field"><label>Email address</label><input class="input" type="email" name="email" required placeholder="you@college.com"></div><div class="field"><label>Password</label><input class="input" type="password" name="password" required placeholder="Enter password"></div><div class="field"><label>Sign in as</label><select class="input" name="role"><option>Student</option><option>Faculty</option><option>Admin</option></select></div><button class="btn">Sign in</button><span class="register-link" id="registerLink">New here? Create a member account</span><div class="demo"><b>Demo admin</b> &nbsp; admin@library.com / admin123<br><b>Student</b> &nbsp; aarav@college.com / student123<br><b>Faculty</b> &nbsp; neha@college.com / faculty123</div></form></section></main>`;document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),u=db.users.find(x=>x.email.toLowerCase()===String(f.get('email')).trim().toLowerCase()&&x.password===f.get('password')&&x.role===f.get('role'));if(!u)return toast('Email, password, or account type is incorrect.',true);me=u;sessionStorage.setItem('libraryDeskUser',JSON.stringify(me));render()};document.getElementById('registerLink').onclick=register}
function register(){let name=prompt('Your full name');if(!name)return;let email=prompt('College email');if(!email)return;let password=prompt('Choose a password (at least 6 characters)');if(!password)return;if(password.length<6||db.users.some(u=>u.email.toLowerCase()===email.toLowerCase()))return toast('Use a longer password and a new email address.',true);let role=confirm('Register as faculty? Choose Cancel for student.')?'Faculty':'Student';db.users.push({id:id('U',db.users),name:name.trim(),email:email.trim(),password,role,department:''});save();toast('Account created. Please sign in.');}
function render(){if(!me){loginView();return}let active=db.loans.filter(l=>!l.returnDate),my=db.loans.filter(l=>l.userId===me.id),titles=db.books.length,copies=db.books.reduce((n,b)=>n+b.total,0),available=db.books.reduce((n,b)=>n+b.available,0);let nav=['Overview','Books','My Loans','History',...(me.role==='Admin'?['Users','Transactions']:[])];let content=page==='Overview'?overview(titles,copies,available):page==='Books'?booksView():page==='My Loans'?loanView(my,false):page==='History'?historyView():page==='Users'?usersView():transactionsView();document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">▤</div><div><strong>Library Desk</strong><small>Campus collection</small></div></div><nav class="nav">${nav.map(n=>`<button class="${page===n?'active':''}" data-page="${n}">${({'Overview':'◫','Books':'▤','My Loans':'↗','History':'◷','Users':'♙','Transactions':'⇄'})[n]} &nbsp; ${n}</button>`).join('')}</nav><div class="side-note">A shared space for curious minds.<br><span style="color:#c8d8c5">${db.books.length} titles in the collection</span></div></aside><main class="main"><header class="top"><div><div class="eyebrow">Library workspace</div><h1>${page}</h1></div><div class="userbox"><div class="avatar">${esc(me.name[0].toUpperCase())}</div><div class="user-name"><b>${esc(me.name)}</b><small>${esc(me.role)}${me.department?' · '+esc(me.department):''}</small></div><button class="btn secondary" id="logout">Sign out</button></div></header>${content}</main></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.getElementById('logout').onclick=()=>{me=null;sessionStorage.removeItem('libraryDeskUser');page='Overview';render()};bindPage()}
function overview(titles,copies,available){let mine=db.loans.filter(l=>l.userId===me.id&&!l.returnDate);return `<section class="welcome"><h2>Good to see you, ${esc(me.name.split(' ')[0])}.</h2><p>${me.role==='Admin'?'Keep the collection organized and your members supported.':'Find something worth getting lost in today.'}</p></section><section class="stats"><div class="stat"><label>Book titles</label><strong>${titles}</strong></div><div class="stat"><label>Total copies</label><strong>${copies}</strong></div><div class="stat"><label>Available now</label><strong>${available}</strong></div><div class="stat"><label>${me.role==='Admin'?'Active loans':'My active loans'}</label><strong>${me.role==='Admin'?db.loans.filter(l=>!l.returnDate).length:mine.length}</strong></div></section><section class="panel"><div class="section-head"><div><h2>${me.role==='Admin'?'Collection snapshot':'Your current loans'}</h2><p>${me.role==='Admin'?'Recently added books and circulation at a glance.':'Books checked out to your account.'}</p></div><button class="btn secondary small" data-jump="${me.role==='Admin'?'Transactions':'My Loans'}">View details</button></div>${me.role==='Admin'?bookTable(db.books.slice(-5).reverse(),true):loanTable(mine)}</section>`}
function booksView(){let list=db.books.filter(b=>(b.title+' '+b.author+' '+b.category+' '+b.id).toLowerCase().includes(filter.toLowerCase()));return `<section class="panel"><div class="section-head"><div><h2>Browse collection</h2><p>Search by title, author, category, or book ID.</p></div><div class="tools"><input id="search" class="input search" placeholder="Try “programming” or “B003”" value="${esc(filter)}"><button class="btn secondary" id="clearSearch">Clear</button>${me.role==='Admin'?'<button class="btn" id="addBook">＋ Add book</button>':''}</div></div>${bookTable(list,false)}</section>`}
function bookTable(list,compact){return `<div class="table-wrap"><table><thead><tr><th>Book</th><th>Category</th><th>Copies</th><th>Availability</th>${compact?'':'<th>Action</th>'}</tr></thead><tbody>${list.length?list.map(b=>`<tr><td><span class="book-title">${esc(b.title)}</span><br><span class="sub">${esc(b.author)} · ${esc(b.id)}</span></td><td>${esc(b.category)}</td><td>${b.total}</td><td><span class="pill ${b.available?'':'out'}">${b.available} available</span></td>${compact?'':`<td><button class="btn small ${b.available?'':'secondary'}" data-issue="${b.id}" ${b.available?'':'disabled'}>Borrow</button>${me.role==='Admin'?` <button class="btn danger small" data-delete="${b.id}">Delete</button>`:''}</td>`}</tr>`).join(''):`<tr><td colspan="5" class="empty">No titles match your search.</td></tr>`}</tbody></table></div>`}
function loanTable(list){return `<div class="table-wrap"><table><thead><tr><th>Book</th><th>Issued</th><th>Due date</th><th>Fine</th><th></th></tr></thead><tbody>${list.length?list.map(l=>{let b=db.books.find(x=>x.id===l.bookId);return `<tr><td><span class="book-title">${esc(b?.title||'Removed title')}</span></td><td>${l.issueDate}</td><td>${l.dueDate}</td><td>₹${fine(l)}</td><td><button class="btn secondary small" data-return="${l.id}">Return</button></td></tr>`}).join(''):`<tr><td colspan="5" class="empty">No books are currently checked out to you.</td></tr>`}</tbody></table></div>`}
function loanView(list){let active=list.filter(l=>!l.returnDate);return `<section class="panel"><div class="section-head"><div><h2>Books on your account</h2><p>Student limit: 3 books · Faculty limit: 5 books · Student late fine: ₹2/day</p></div><button class="btn" data-jump="Books">Browse books</button></div>${loanTable(active)}</section>`}
function historyView(){let list=db.loans.filter(l=>l.userId===me.id);return `<section class="panel"><div class="section-head"><div><h2>Borrowing history</h2><p>Past and active loans with calculated late fees.</p></div></div><div class="table-wrap"><table><thead><tr><th>Book</th><th>Issued</th><th>Due</th><th>Returned</th><th>Status</th><th>Fine</th></tr></thead><tbody>${list.length?list.map(l=>`<tr><td>${esc(db.books.find(b=>b.id===l.bookId)?.title||l.bookId)}</td><td>${l.issueDate}</td><td>${l.dueDate}</td><td>${l.returnDate||'—'}</td><td><span class="pill ${l.returnDate?'':'out'}">${l.returnDate?'Returned':'Issued'}</span></td><td>₹${fine(l)}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">Your borrowing history will appear here.</td></tr>`}</tbody></table></div></section>`}
function usersView(){return `<section class="panel"><div class="section-head"><div><h2>Library members</h2><p>${db.users.length} registered accounts</p></div></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Active loans</th></tr></thead><tbody>${db.users.map(u=>`<tr><td class="book-title">${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="pill">${esc(u.role)}</span></td><td>${esc(u.department||'—')}</td><td>${db.loans.filter(l=>l.userId===u.id&&!l.returnDate).length}</td></tr>`).join('')}</tbody></table></div></section>`}
function transactionsView(){return `<section class="panel"><div class="section-head"><div><h2>All transactions</h2><p>Circulation activity across the library.</p></div></div><div class="table-wrap"><table><thead><tr><th>Member</th><th>Book</th><th>Issued</th><th>Due</th><th>Returned</th><th>Fine</th></tr></thead><tbody>${db.loans.length?db.loans.map(l=>`<tr><td>${esc(db.users.find(u=>u.id===l.userId)?.name||l.userId)}</td><td>${esc(db.books.find(b=>b.id===l.bookId)?.title||l.bookId)}</td><td>${l.issueDate}</td><td>${l.dueDate}</td><td>${l.returnDate||'—'}</td><td>₹${fine(l)}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">No transactions yet.</td></tr>`}</tbody></table></div></section>`}
function bindPage(){document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{page=b.dataset.jump;render()});let s=document.getElementById('search');if(s)s.oninput=()=>{filter=s.value;let pos=s.selectionStart;render();let next=document.getElementById('search');next.focus();next.setSelectionRange(pos,pos)};let c=document.getElementById('clearSearch');if(c)c.onclick=()=>{filter='';render()};let a=document.getElementById('addBook');if(a)a.onclick=()=>document.getElementById('bookDialog').showModal();document.querySelectorAll('[data-issue]').forEach(b=>b.onclick=()=>issue(b.dataset.issue));document.querySelectorAll('[data-return]').forEach(b=>b.onclick=()=>returnLoan(b.dataset.return));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteBook(b.dataset.delete))}
function issue(bookId){let b=db.books.find(x=>x.id===bookId),limit=me.role==='Faculty'?5:3,active=db.loans.filter(l=>l.userId===me.id&&!l.returnDate);if(!b||b.available<1)return toast('No copies are available.',true);if(active.length>=limit)return toast(`Your ${limit}-book borrowing limit has been reached.`,true);if(active.some(l=>l.bookId===bookId))return toast('You already have this title checked out.',true);let now=new Date(),due=new Date(now);due.setDate(due.getDate()+(me.role==='Faculty'?30:14));db.loans.push({id:id('L',db.loans),userId:me.id,bookId,issueDate:now.toISOString().slice(0,10),dueDate:due.toISOString().slice(0,10),returnDate:null});b.available--;save();toast('Book borrowed. Due '+due.toLocaleDateString());render()}
function returnLoan(loanId){let l=db.loans.find(x=>x.id===loanId&&x.userId===me.id&&!x.returnDate);if(!l)return;let fee=fine(l);l.returnDate=new Date().toISOString().slice(0,10);let b=db.books.find(x=>x.id===l.bookId);if(b)b.available=Math.min(b.total,b.available+1);save();toast(`Book returned. Fine: ₹${fee}`);render()}
function deleteBook(bookId){if(db.loans.some(l=>l.bookId===bookId&&!l.returnDate))return toast('Return active copies before deleting this title.',true);if(!confirm('Delete this title from the collection?'))return;db.books=db.books.filter(b=>b.id!==bookId);save();render();toast('Book removed.')}
document.getElementById('bookForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),n=Number(f.get('copies'));if(n<1)return;db.books.push({id:id('B',db.books),title:String(f.get('title')).trim(),author:String(f.get('author')).trim(),category:String(f.get('category')).trim(),total:n,available:n});save();e.target.reset();document.getElementById('bookDialog').close();page='Books';render();toast('Book added to the collection.')};render();
</script></body></html>
